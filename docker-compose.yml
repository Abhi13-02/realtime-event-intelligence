# All environment variables are loaded from .env automatically by Docker Compose.
# Copy .env.example to .env and fill in your values before running.

services:

  # ─────────────────────────────────────────────────────────────────
  # POSTGRESQL + PGVECTOR
  # Main database for all persistent data.
  # ankane/pgvector:pg15 = PostgreSQL 15 with the pgvector extension pre-installed.
  # pgvector adds a VECTOR column type and cosine similarity search — used for
  # deduplication (Stage 1) and topic matching (Stage 2) in the pipeline.
  #
  # Named volume 'postgres_data' persists your database between container restarts.
  # 'docker compose down' keeps the volume (data safe).
  # 'docker compose down -v' destroys the volume (data lost — use carefully).
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.2-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # Expose to host machine for DB tools (DBeaver, psql, TablePlus)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────
  # REDIS
  # Two roles in one instance (separated by database number):
  #   db=0 — Celery task broker (Beat writes tasks here; Worker reads them)
  #   db=1 — WebSocket ticket store (one-time auth tokens for WS connections)
  # redis:7-alpine uses the Alpine Linux base — much smaller image than redis:7.
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.8-alpine
    ports:
      - "6379:6379"   # Expose to host machine for Redis tools (RedisInsight, redis-cli)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ─────────────────────────────────────────────────────────────────
  # MIGRATE
  # One-shot: applies Alembic migrations, then exits.
  #
  # It now also creates queue_messages, the table that replaced Kafka. That
  # makes it a hard prerequisite for the two consumers, not just the backend —
  # both already wait on service_completed_successfully below.
  #
  # Migrations used to run inside docker-entrypoint.sh on every backend start.
  # That is fine with one backend, and a race the moment there are two —
  # N replicas would each run `alembic upgrade head` against the same database
  # at the same time. Running it exactly once, before anything that reads the
  # schema starts, removes the race entirely.
  # ─────────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: runtime-slim
    command: alembic upgrade head
    restart: "no"
    volumes:
      # Same mount every other service uses, for two reasons beyond consistency.
      #
      # Without it this container runs whatever `app/` and `alembic/` were baked
      # into the image at its last build, so a new revision — or a fix to code a
      # revision imports — is silently ignored until someone remembers to
      # rebuild. Migrations are the one place where running stale code is worst.
      #
      # It is also what makes this the test runner: the image deliberately does
      # not COPY tests/ (they have no business in a runtime image), so the
      # command in tests/test_pg_queue.py only works because the repo is mounted.
      - ./:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # ALERT CONSUMER
  # Claims from both alert queues, writes alert rows, enqueues SMS,
  # and broadcasts WebSocket deliveries over the Redis backplane.
  #
  # Previously two asyncio tasks inside the backend process. Splitting them out
  # is what allows the backend to scale past one replica: an alert consumed by
  # backend replica B could not reach a socket held by replica A.
  # ─────────────────────────────────────────────────────────────────
  alert-consumer:
    build:
      context: .
      target: runtime-slim
    command: python -m app.alert.runner
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # ─────────────────────────────────────────────────────────────────
  # EMBEDDING SERVICE
  # The only container that loads PyTorch. Everything that needs a vector
  # (backend, pipeline-consumer) calls this over HTTP instead of holding its
  # own 420MB copy of the Sentence-BERT weights.
  #
  # Deliberately NOT HuggingFace TEI. TEI is a different inference engine and
  # would not reproduce the vectors already stored in pgvector bit-for-bit.
  # This runs the exact pinned torch/sentence-transformers stack from
  # requirements.txt, which is the entire point.
  #
  # start_period is generous: the model load takes several seconds on ARM,
  # and dependents must not be told it is ready before it can answer.
  # ─────────────────────────────────────────────────────────────────
  embedding-service:
    build:
      context: .
      target: runtime-heavy
    command: uvicorn app.embedding_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"   # Exposed to the host so benchmark scripts can call it directly
    volumes:
      - ./:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────────────────────────
  # BACKEND (FastAPI)
  # The main app: serves REST API and WebSocket connections.
  # Also runs the Alert Service (co-located in v1).
  #
  # depends_on with service_healthy: the backend only starts AFTER
  # PostgreSQL and Redis confirm they are ready to accept connections.
  # Without this, the app starts while the DB is still initializing
  # and crashes immediately with a "connection refused" error.
  #
  # volume ./:/app: mounts your local code into the container.
  # Any code change you save appears inside the container immediately —
  # no rebuild needed. uvicorn --reload (if enabled) will restart automatically.
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: runtime-slim
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────
  # CELERY WORKER
  # Executes task functions when they are enqueued (by Beat or by the app).
  # Uses the same Docker image as the backend — same code, different process.
  # Why the same image? The crawl tasks and alert tasks live in your app code.
  # The worker imports and runs those task functions, so it needs everything
  # the backend has.
  # ─────────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      target: runtime-ml
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # ─────────────────────────────────────────────────────────────────
  # CELERY WORKER (DISCOVERY)
  # Dedicated worker for heavy NLP clustering tasks (UMAP/HDBSCAN).
  # Isolated so CPU-heavy tasks don't starve the ingestion worker.
  # ─────────────────────────────────────────────────────────────────
  celery-worker-discovery:
    build:
      context: .
      target: runtime-ml
    command: celery -A app.celery_app worker -Q discovery --loglevel=info --concurrency=2 --pool=prefork
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
  # ─────────────────────────────────────────────────────────────────
  # CELERY BEAT
  # The scheduler — fires task messages into Redis on a cron schedule.
  # Beat does NOT execute tasks itself. It only enqueues them.
  # The Worker picks them up and runs them.
  #
  # Beat and Worker are intentionally separate processes. Running them
  # together (celery worker --beat) works in dev but is unreliable in
  # production because Beat state can be lost on worker crashes.
  # ─────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      target: runtime-ml
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─────────────────────────────────────────────────────────────────
  # PIPELINE CONSUMER
  # Long-running process that claims raw-articles from the queue and runs
  # each article through the NLP pipeline (dedup → topic match →
  # store → summarise → route to matched-articles).
  #
  # Runs as a separate container so it can crash and restart independently
  # without affecting the API. Scale horizontally by increasing replicas:
  # SELECT ... FOR UPDATE SKIP LOCKED hands every replica a disjoint batch,
  # so there is no partition count to cap them at. Kafka capped this at 3.
  # ─────────────────────────────────────────────────────────────────
  pipeline-consumer:
    build:
      context: .
      target: runtime-ml
    command: python -m app.pipeline.consumer
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true


  # ─────────────────────────────────────────────────────────────────
  # DEPLOYMENT-ONLY SERVICES  (docker compose --profile deploy up -d)
  # Not started by a plain `docker compose up`, so local dev is unchanged.
  #
  # frontend    — Next.js production build
  # proxy       — nginx: single entrypoint routing / → frontend and
  #               /v1/ → backend (incl. the WebSocket)
  # cloudflared — Cloudflare *quick* tunnel exposing the proxy at a throwaway
  #               https://<random>.trycloudflare.com hostname
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    profiles: ["deploy"]
    environment:
      - BACKEND_URL=http://backend:8000/v1
      - AUTH_TRUST_HOST=true
    env_file:
      - .env
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    profiles: ["deploy"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["deploy"]
    # Anonymous "quick tunnel": no Cloudflare account, no credentials file and
    # no DNS record. cloudflared dials out to Cloudflare's edge and is handed a
    # random https://<two-or-three-words>.trycloudflare.com hostname, printed
    # in this container's logs a few seconds after start:
    #
    #   docker compose logs cloudflared | grep trycloudflare.com
    #
    # Tradeoff, and it is the whole reason this is not the default: the hostname
    # is tied to the tunnel session, so it changes every time the container
    # restarts. `restart: unless-stopped` keeps it alive across crashes, but a
    # `docker compose up`/`restart`/VM reboot hands out a brand new link and the
    # old one dies. Fine for sharing a demo, not for anything durable.
    #
    # The named-tunnel config that served this on a custom domain is still in
    # deploy/cloudflared/config.yml — see the header there to switch back.
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────
# NAMED VOLUMES
# Named volumes are managed by Docker and persist on your machine
# between container restarts. The data lives outside the container.
# Only postgres needs persistence here — Redis holds the Celery broker and
# WebSocket tickets, both ephemeral in development (fine to lose on restart).
# The work queue is a Postgres table now, so it is covered by this volume.
# ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
